name: Release

# Publishing a GitHub Release (or pushing a v* tag) builds the macOS app and
# attaches a zip to that release.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: macos-26
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Validate release configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Select a stable vX.Y.Z tag.' >&2; exit 1; }
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Configure the SPARKLE_PRIVATE_KEY repository secret first.' >&2; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Resources/Info.plist >/dev/null

      - name: Stamp version
        if: startsWith(env.TAG, 'v')
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${TAG#v}" Resources/Info.plist
          # Deterministic, ordered across reruns and workflow changes.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${TAG#v}" Resources/Info.plist

      - name: Checks
        run: bash Scripts/check.sh --native-file-events

      - name: Build app
        run: bash Scripts/build.sh

      - name: Sign and verify update package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash Scripts/package-update.sh "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: a-watcher-${{ env.TAG }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(env.TAG, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pushed tag creates its release; a published release is reused.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "a-watcher $TAG" --generate-notes
          gh release upload "$TAG" "dist/a-watcher-${TAG}-macos-arm64.zip" dist/appcast.xml dist/SHA256SUMS.txt --clobber
